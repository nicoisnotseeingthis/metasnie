name: OP Checker

on:
  workflow_dispatch:
  schedule:
    # restart every 5 hours so it runs continuously as close to 24/7 as GitHub allows
    - cron: '0 */5 * * *'

concurrency:
  group: op-checker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub hard-caps each job at 6 hours; stop just before that
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials from secret
        env:
          CREDS_JSON: ${{ secrets.CREDS_JSON }}
        run: |
          mkdir -p creds
          if [ -n "$CREDS_JSON" ]; then
            echo "$CREDS_JSON" > creds/creds.json
          fi

      - name: Restore update-report stats
        uses: actions/cache/restore@v4
        with:
          path: state/stats.json
          key: stats-${{ github.run_id }}
          restore-keys: stats-

      - name: Run headless checker
        env:
          # 5 hours 30 minutes in seconds
          MAX_RUNTIME: '19800'
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python headless.py

      - name: Save update-report stats
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/stats.json
          key: stats-${{ github.run_id }}
